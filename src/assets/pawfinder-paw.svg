<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pink paw print">
  <defs>
    <linearGradient id="pawBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141a2e"/>
      <stop offset="55%" stop-color="#1b1f3d"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="pawGlow" cx="50%" cy="52%" r="55%">
      <stop offset="0%" stop-color="#ff4ecb" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff4ecb" stop-opacity="0"/>
    </radialGradient>
    <filter id="soften" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <rect width="400" height="250" fill="url(#pawBg)"/>
  <rect width="400" height="250" fill="url(#pawGlow)"/>

  <g fill="#ff4ecb" filter="url(#soften)">
    <ellipse cx="200" cy="156" rx="60" ry="50"/>
    <ellipse cx="138" cy="100" rx="25" ry="31" transform="rotate(-20 138 100)"/>
    <ellipse cx="180" cy="72" rx="25" ry="31" transform="rotate(-7 180 72)"/>
    <ellipse cx="222" cy="72" rx="25" ry="31" transform="rotate(7 222 72)"/>
    <ellipse cx="264" cy="100" rx="25" ry="31" transform="rotate(20 264 100)"/>
  </g>
</svg>
